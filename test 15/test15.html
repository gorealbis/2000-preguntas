<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Test Interactivo - Test 15</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-container { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 650px; padding: 30px; }
        .quiz-header h1 { font-size: 24px; color: #1e293b; margin-bottom: 15px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 8px; width: 100%; margin-bottom: 10px; overflow: hidden; }
        .progress-fill { background: #3b82f6; height: 100%; width: 0%; transition: width 0.3s ease; }
        #question-number { font-size: 14px; color: #64748b; font-weight: 600; margin-bottom: 20px; }
        #question-text { font-size: 18px; color: #0f172a; line-height: 1.5; margin-bottom: 25px; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; color: #334155; cursor: pointer; font-size: 16px; padding: 14px 20px; text-align: left; transition: all 0.2s ease; width: 100%; }
        .option-btn:hover:not([disabled]) { background: #f1f5f9; border-color: #cbd5e1; }
        .correct { background-color: #10b981 !important; border-color: #059669 !important; color: white !important; font-weight: 600; }
        .incorrect { background-color: #ef4444 !important; border-color: #dc2626 !important; color: white !important; }
        .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .score-board { font-size: 16px; color: #1e293b; font-weight: 600; }
        #score { color: #3b82f6; font-size: 20px; }
        .btn-next { background: #3b82f6; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 16px; font-weight: 600; padding: 12px 24px; transition: background 0.2s; display: none; }
        .btn-next:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz-body-wrapper">
            <div class="quiz-header">
                <h1>TEST 15: Auxiliar de Enfermería</h1>
                <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
                <p id="question-number">Cargando...</p>
            </div>
            <div class="quiz-body">
                <h2 id="question-text">Cargando pregunta...</h2>
                <div id="options-container" class="options-grid"></div>
            </div>
        </div>
        <div class="quiz-footer">
            <div class="score-board">Puntuación: <span id="score">0</span></div>
            <button id="next-btn" class="btn-next" onclick="nextQuestion()">Siguiente Pregunta</button>
        </div>
    </div>

    <!-- Enlace al nuevo archivo JavaScript correspondiente a este bloque -->
    <script src="script15.js"></script>
</body>
</html>
